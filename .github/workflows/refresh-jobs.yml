name: Refresh jobs

on:
  schedule:
    - cron: "17 */12 * * *"   # every 12 hours
  workflow_dispatch: {}        # "Run workflow" button
  push:
    branches: [main]
    paths: ["config.json", "scripts/**", ".github/workflows/refresh-jobs.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch jobs
        env:
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python scripts/fetch_jobs.py
      - name: Commit jobs.json
        run: |
          git config user.name "jobscout-bot"
          git config user.email "jobscout-bot@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || (git commit -m "Update jobs.json" && git pull --rebase && git push)
